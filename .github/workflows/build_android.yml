name: Build Android APK

on:
  push:
    branches: [main, master, implement]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Drift's generated app_database.g.dart emits 2 unavoidable
        # warnings (unnecessary_null_comparison,
        # unnecessary_non_null_assertion). These are codegen artifacts,
        # not code we author. Treat warnings as non-fatal; errors will
        # still fail the job.
        run: flutter analyze --no-fatal-warnings

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: flutter test --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      # Debug APK avoids signing-key plumbing in CI; users can promote
      # to a signed release build by adding a keystore secret later.
      # Cache Gradle wrapper to avoid downloading Gradle distribution on every run
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: temp-monitor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Run unit tests
        run: flutter test --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Decode keystore
        run: printf '%s' "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # Cache Gradle wrapper to avoid downloading Gradle distribution on every run
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/temp-monitor-${{ steps.version.outputs.version }}.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: temp-monitor-v${{ steps.version.outputs.version }}-release-apk
          path: build/app/outputs/flutter-apk/temp-monitor-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            温湿度监控 App v${{ steps.version.outputs.version }}

            ## 变更
            - 查看 Git 提交历史了解详情
          files: build/app/outputs/flutter-apk/temp-monitor-${{ steps.version.outputs.version }}.apk
          make_latest: true
          draft: false
          prerelease: false
