<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 - Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0B0C0F;
      --bg-secondary: #14161B;
      --bg-tertiary: #1E2128;
      --text-primary: #F0F2F5;
      --text-secondary: #8B919D;
      --text-muted: #5A6270;
      --accent-temp: #FF9F43;
      --accent-humidity: #4DABF7;
      --accent-success: #51CF66;
      --border: #2A2E37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #1a1c22;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .phone {
      width: 375px;
      height: 812px;
      background: var(--bg-primary);
      border-radius: 40px;
      border: 8px solid #2A2E37;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 16px;
    }
    .app-bar h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .app-bar .icon {
      width: 24px;
      height: 24px;
      color: var(--text-secondary);
    }
    .content {
      flex: 1;
      padding: 0 24px;
      overflow-y: auto;
    }
    .hero-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      margin-bottom: 16px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .hero-item {
      display: flex;
      flex-direction: column;
    }
    .hero-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .hero-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 52px;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 8px;
    }
    .hero-value.temp { color: var(--accent-temp); }
    .hero-value.humidity { color: var(--accent-humidity); }
    .hero-unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: var(--text-secondary);
    }
    .hero-trend {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 8px;
    }
    .hero-trend.up { color: var(--accent-temp); }
    .hero-trend.down { color: var(--accent-humidity); }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-success);
    }
    .secondary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .secondary-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .secondary-card .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .secondary-card .value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 400;
      color: var(--text-primary);
    }
    .secondary-card .icon {
      width: 20px;
      height: 20px;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .button-primary {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      color: var(--text-primary);
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .section-title {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .history-list {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-time {
      font-size: 13px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }
    .history-values {
      display: flex;
      gap: 16px;
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
    }
    .history-values .temp { color: var(--accent-temp); }
    .history-values .humidity { color: var(--accent-humidity); }
    .bottom-nav {
      height: 80px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 16px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 11px;
    }
    .nav-item.active {
      color: var(--accent-humidity);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">9:41</div>
    <div class="app-bar">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <h1>客厅</h1>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
      </svg>
    </div>
    <div class="content">
      <div class="hero-card">
        <div class="hero-grid">
          <div class="hero-item">
            <div class="hero-label">温度</div>
            <div class="hero-value temp">25.3<span class="hero-unit">°C</span></div>
            <div class="hero-trend up">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
              0.5
            </div>
          </div>
          <div class="hero-item">
            <div class="hero-label">湿度</div>
            <div class="hero-value humidity">62.0<span class="hero-unit">%</span></div>
            <div class="hero-trend down">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <path d="M12 5v14M5 12l7 7 7-7"/>
              </svg>
              2.1
            </div>
          </div>
        </div>
        <div class="status-row">
          <div class="status-dot"></div>
          <span>设备在线 · 5 秒前更新</span>
        </div>
      </div>

      <div class="secondary-grid">
        <div class="secondary-card">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/>
          </svg>
          <div class="label">电量</div>
          <div class="value">85%</div>
        </div>
        <div class="secondary-card">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
          </svg>
          <div class="label">信号</div>
          <div class="value">-65</div>
        </div>
      </div>

      <button class="button-primary">查看历史曲线</button>

      <div class="section-title">最近记录</div>
      <div class="history-list">
        <div class="history-item">
          <span class="history-time">14:30</span>
          <div class="history-values">
            <span class="temp">25.1°C</span>
            <span class="humidity">61.8%</span>
          </div>
        </div>
        <div class="history-item">
          <span class="history-time">14:25</span>
          <div class="history-values">
            <span class="temp">24.9°C</span>
            <span class="humidity">62.5%</span>
          </div>
        </div>
        <div class="history-item">
          <span class="history-time">14:20</span>
          <div class="history-values">
            <span class="temp">24.8°C</span>
            <span class="humidity">63.1%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>设备</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/>
        </svg>
        <span>历史</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>设置</span>
      </div>
    </div>
  </div>
</body>
</html>
