<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设备列表 - Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0B0C0F;
      --bg-secondary: #14161B;
      --bg-tertiary: #1E2128;
      --text-primary: #F0F2F5;
      --text-secondary: #8B919D;
      --text-muted: #5A6270;
      --accent-temp: #FF9F43;
      --accent-humidity: #4DABF7;
      --accent-success: #51CF66;
      --border: #2A2E37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', sans-serif;
      background: #1a1c22;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .phone {
      width: 375px;
      height: 812px;
      background: var(--bg-primary);
      border-radius: 40px;
      border: 8px solid #2A2E37;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 16px;
    }
    .app-bar h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .content {
      flex: 1;
      padding: 0 24px;
      overflow-y: auto;
    }
    .device-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .device-card:hover {
      transform: scale(0.98);
    }
    .device-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-temp);
    }
    .device-icon svg {
      width: 24px;
      height: 24px;
    }
    .device-info {
      flex: 1;
    }
    .device-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .device-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .device-values {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .device-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 400;
    }
    .device-value.temp { color: var(--accent-temp); }
    .device-value.humidity { color: var(--accent-humidity); }
    .device-arrow {
      color: var(--text-muted);
      margin-left: 4px;
    }
    .add-button {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 18px;
      color: var(--text-secondary);
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      margin-top: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--text-secondary);
      text-align: center;
      padding: 0 32px;
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      color: var(--text-muted);
    }
    .bottom-nav {
      height: 80px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 16px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 11px;
    }
    .nav-item.active {
      color: var(--accent-humidity);
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">9:41</div>
    <div class="app-bar">
      <h1>设备列表</h1>
    </div>
    <div class="content">
      <div class="device-card">
        <div class="device-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>
          </svg>
        </div>
        <div class="device-info">
          <div class="device-name">客厅</div>
          <div class="device-meta">5 秒前 · 在线 · 信号 -65 dBm</div>
        </div>
        <div class="device-values">
          <div class="device-value temp">25.3°C</div>
          <div class="device-value humidity">62.0%</div>
        </div>
        <div class="device-arrow">▸</div>
      </div>

      <div class="device-card">
        <div class="device-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>
          </svg>
        </div>
        <div class="device-info">
          <div class="device-name">卧室</div>
          <div class="device-meta">1 分钟前 · 在线 · 信号 -72 dBm</div>
        </div>
        <div class="device-values">
          <div class="device-value temp">24.8°C</div>
          <div class="device-value humidity">63.1%</div>
        </div>
        <div class="device-arrow">▸</div>
      </div>

      <button class="add-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        添加设备
      </button>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>设备</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/>
        </svg>
        <span>历史</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>设置</span>
      </div>
    </div>
  </div>
</body>
</html>
