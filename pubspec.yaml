name: temp_monitor
description: A BThome v2 temperature and humidity monitor
publish_to: 'none'
version: 1.1.6+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  flutter_background_service: ^5.0.6
  flutter_background_service_android: ^6.2.3
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  flutter_bloc: ^8.1.6
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  phosphor_flutter: ^2.1.0
  provider: ^6.1.2
  equatable: ^2.0.5
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  # Used only by `test/sensor_repository_test.dart` on Linux dev hosts to
  # point the loader at `libsqlite3.so.0` (the SONAME-versioned library
  # most distros ship). On-device, drift_flutter bundles sqlite3 via
  # sqlite3_flutter_libs, so this is dev/CI only.
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
